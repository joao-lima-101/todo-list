<form [formRoot]="changePasswordForm">
  <h2 mat-dialog-title>Trocar senha</h2>
  <mat-dialog-content>
    <div class="flex flex-col gap-3">
      <div class="flex flex-col gap-2">
        <input
          type="password"
          id="name"
          [class]="hasPasswordError() ? 'input-error-secondary' : 'input-secondary'"
          placeholder="Digite a senha atual"
          [formField]="changePasswordForm.password"
        />

        @if (hasPasswordError()) {
          <div class="text-sm text-red-500">
            {{ changePasswordForm.password().errors()[0].message }}
          </div>
        }
      </div>
      <div class="flex flex-col gap-2">
        <input
          type="password"
          id="name"
          [class]="hasNewPasswordError() ? 'input-error-secondary' : 'input-secondary'"
          placeholder="Digite uma nova senha"
          [formField]="changePasswordForm.newPassword"
        />

        @if (hasNewPasswordError()) {
          <div class="text-sm text-red-500">
            {{ changePasswordForm.newPassword().errors()[0].message }}
          </div>
        }
      </div>
      <div>
        <input
          type="password"
          id="name"
          [class]="hasConfirmPasswordError() ? 'input-error-secondary' : 'input-secondary'"
          placeholder="Confirme a nova senha"
          [formField]="changePasswordForm.confirmPassword"
        />

        @if (hasConfirmPasswordError()) {
          <div class="text-sm text-red-500">
            {{ changePasswordForm.confirmPassword().errors()[0].message }}
          </div>
        }
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="flex flex-row gap-5">
    <button
      mat-dialog-close
      class="button-secondary transition text-white bg-red-500 hover:bg-red-700"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="button-secondary transition text-white bg-green-500 hover:bg-green-700"
    >
      Criar
    </button>
  </mat-dialog-actions>
</form>
