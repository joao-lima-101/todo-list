<div class="container-center">
  <div class="min-w-1/4 p-10 rounded-lg bg-gray-200 flex flex-col gap-4">
    <div class="flex gap-5 items-center">
      <mat-icon
        style="width: 50px; height: 50px; font-size: 40px"
        class="border-3 rounded-full text-center"
      >
        person
      </mat-icon>
      <div>
        <h1 class="text-3xl font-bold">Login</h1>
        <p class="text-sm text-gray-500">Faça login para utilizar o sistema</p>
      </div>
    </div>

    <hr class="text-gray-300" />

    <form [formRoot]="loginForm">
      <div class="flex flex-col gap-2">
        <div class="flex flex-col gap-1">
          <label for="email">E-mail</label>
          <input
            type="email"
            [formField]="loginForm.email"
            id="email"
            class="input-primary"
            [class]="hasEmailError() ? 'input-error-primary' : 'border-transparent'"
          />
          @if (hasEmailError()) {
            <div class="text-xs text-red-500">
              {{ loginForm.email().errors()[0].message }}
            </div>
          }
        </div>

        <div class="flex flex-col gap-1">
          <label for="password">Senha</label>
          <input
            type="password"
            [formField]="loginForm.password"
            id="password"
            class="input-primary"
            [class]="hasPasswordError() ? 'input-error-primary' : 'border-transparent'"
          />
          @if (hasPasswordError()) {
            <div class="text-xs text-red-500">
              {{ loginForm.password().errors()[0].message }}
            </div>
          }
        </div>
        <div class="flex justify-between items-center mt-3">
          <p>Esqueceu a senha?</p>

          <button type="submit" class="button-primary" [disabled]="isLoading()">
            Acessar
            @if (isLoading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              <mat-icon style="width: 20px; height: 20px; font-size: 20px">arrow_forward</mat-icon>
            }
          </button>
        </div>
      </div>
    </form>

    <hr class="text-gray-300" />

    <p>
      Novo por aqui?
      <a routerLink="/register" class="text-blue-700 hover:underline hover:text-blue-500">
        cadastre-se!
      </a>
    </p>
  </div>
</div>
