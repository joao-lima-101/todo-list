spring.application.name=todo-server

api.security.token.secret=${JWT_SECRET:CHAVE_SECRETA_PARA_DESENVOLVIMENTO}
api.security.token.expiration-time=900000

app.rate-limiting.routes.login.path=/auth/login
app.rate-limiting.routes.login.capacity=3
app.rate-limiting.routes.login.time-minutes=1

spring.devtools.restart.log-condition-evaluation-delta=false